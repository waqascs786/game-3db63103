name: Build & Preview Game

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game ID'
        required: true
      game_name:
        description: 'Game Name'
        required: true
      user_email:
        description: 'User email for notifications'
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      public_key: ${{ steps.upload.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing keystore
        run: echo "" | base64 -d > /tmp/release.jks

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - name: Create Flutter project scaffold
        run: |
          set -e
          ORG="com.android"
          PROJ="game7"
          TEMP_DIR=$(mktemp -d)
          flutter create --no-pub --org "$ORG" --project-name "$PROJ" "$TEMP_DIR/_scaffold"
          rm -rf android ios web linux macos windows test .dart_tool .flutter-plugins .flutter-plugins-dependencies .metadata
          cp -r "$TEMP_DIR/_scaffold/android" .
          cp -r "$TEMP_DIR/_scaffold/ios" .
          cp -r "$TEMP_DIR/_scaffold/web" .
          cp -r "$TEMP_DIR/_scaffold/linux" .
          cp -r "$TEMP_DIR/_scaffold/macos" .
          cp -r "$TEMP_DIR/_scaffold/windows" .
          cp -r "$TEMP_DIR/_scaffold/test" .
          cp "$TEMP_DIR/_scaffold/.gitignore" .
          rm -rf "$TEMP_DIR"

      - name: Verify project structure
        run: |
          echo "=== CWD ===" && pwd
          echo "=== lib/ ===" && ls -la lib/
          echo "=== main.dart ===" && head -3 lib/main.dart
          echo "=== android/ ===" && ls -la android/
          echo "=== android/app/ ===" && ls -la android/app/
          echo "=== pubspec.yaml ===" && head -5 pubspec.yaml

      - name: Configure Android signing
        run: echo "" | base64 -d > /tmp/configure_signing.py && python3 /tmp/configure_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: |
          set +e
          flutter build apk --debug > build_debug.log 2>&1
          EXIT=$?
          echo "=== DEBUG BUILD EXIT CODE: $EXIT ==="
          tail -80 build_debug.log
          exit $EXIT

      - name: Build Android release APK
        run: |
          set +e
          flutter build apk --release > build_release.log 2>&1
          EXIT=$?
          echo "=== RELEASE BUILD EXIT CODE: $EXIT ==="
          tail -80 build_release.log
          exit $EXIT

      - name: Build Android release AAB
        run: |
          set +e
          flutter build appbundle --release > build_aab.log 2>&1
          EXIT=$?
          echo "=== AAB BUILD EXIT CODE: $EXIT ==="
          tail -80 build_aab.log
          exit $EXIT

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK to Appetize.io
        id: upload
        if: success()
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          SHORT_ID="${{ github.event.inputs.game_id }}"
          SHORT_ID="${SHORT_ID%%-*}"
          SHORT_ID="${SHORT_ID:0:20}"
          RESPONSE=$(curl -s -X POST \
            -H "X-API-KEY: $APPETIZE_TOKEN" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "platform=android" \
            -F "tags[]=$SHORT_ID" \
            https://api.appetize.io/v2/builds)
          echo "Android response: $RESPONSE"
          BUILD_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "public_key=$BUILD_ID" >> $GITHUB_OUTPUT

  notify:
    needs: [build-android]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write email script
        run: |
          cat > /tmp/send_email.py << "ENDSCRIPT"
          import smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          game_name = os.environ["GAME_NAME"]
          user_email = os.environ["USER_EMAIL"]
          android_url = os.environ["ANDROID_URL"]
          android_artifact = os.environ.get("ANDROID_ARTIFACT_URL", "")
          aab_artifact = os.environ.get("AAB_ARTIFACT_URL", "")
          game_id = os.environ["GAME_ID"]
          gmail_pass = os.environ["GMAIL_APP_PASSWORD"]
          run_id = os.environ["RUN_ID"]
          repo = os.environ["REPO"]
          html = "<h2>Your game is ready!</h2>"
          html += "<p><b>" + game_name + "</b> has been built and is ready to preview on Appetize.io.</p>"
          html += "<h3>Live Preview</h3>"
          html += "<p><b>Android:</b> <a href='" + android_url + "'>" + android_url + "</a></p>"
          html += "<h3>Download Builds</h3>"
          if android_artifact:
              html += "<p><b>Android APK:</b> <a href='" + android_artifact + "'>Download APK</a></p>"
          if aab_artifact:
              html += "<p><b>Play Store AAB:</b> <a href='" + aab_artifact + "'>Download AAB</a> (submit to Play Console)</p>"
          html += "<hr><p><small>Game ID: " + game_id + "</small></p>"
          msg = MIMEMultipart("alternative")
          msg["Subject"] = "Game Build Ready: " + game_name
          msg["From"] = "Quiz Game Builder <waqascsme@gmail.com>"
          msg["To"] = user_email
          msg.attach(MIMEText(html, "html"))
          server = smtplib.SMTP("smtp.gmail.com", 587)
          server.starttls()
          server.login("waqascsme@gmail.com", gmail_pass)
          server.sendmail("waqascsme@gmail.com", user_email, msg.as_string())
          server.quit()
          print("Email sent to " + user_email)
          ENDSCRIPT

      - name: Send email via Gmail SMTP
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GAME_NAME: ${{ github.event.inputs.game_name }}
          USER_EMAIL: ${{ github.event.inputs.user_email }}
          GAME_ID: ${{ github.event.inputs.game_id }}
          ANDROID_KEY: ${{ needs.build-android.outputs.public_key }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$USER_EMAIL" ]; then
            echo "No user email, skipping notification"
            exit 0
          fi
          export ANDROID_URL="https://appetize.io/app/$ANDROID_KEY?autoplay=true"
          export ANDROID_ARTIFACT_URL="https://github.com/$REPO/actions/runs/$RUN_ID/artifact/android-apk"
          export AAB_ARTIFACT_URL="https://github.com/$REPO/actions/runs/$RUN_ID/artifact/android-aab"
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "No Gmail app password, skipping email"
            echo "::notice::Android Preview: $ANDROID_URL"
            exit 0
          fi
          python3 /tmp/send_email.py

      - name: Print preview links
        if: always()
        env:
          ANDROID_KEY: ${{ needs.build-android.outputs.public_key }}
        run: |
          echo "=========================================="
          echo "  GAME BUILD COMPLETE!"
          echo "=========================================="
          echo "Android: https://appetize.io/app/$ANDROID_KEY"
          echo "=========================================="
          echo "::notice::Android Preview: https://appetize.io/app/$ANDROID_KEY"